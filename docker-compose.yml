# SEPscope: Postgres, worker, API and dashboard.
#
#   cp .env.example .env
#   docker compose up --build
#
# Dashboard: http://localhost:3000   API: http://localhost:8080/v1/anchors   Docs: http://localhost:8080/docs
# The worker and the API apply database migrations on start.

x-app: &app
  restart: unless-stopped
  # A real init as PID 1; the apps handle SIGTERM themselves and shut down gracefully.
  init: true
  # Longer than SHUTDOWN_TIMEOUT_SECONDS (default 25), so the apps finish before Docker kills them.
  stop_grace_period: 30s
  env_file:
    - path: .env
      required: false

x-database-url: &database-url postgres://${POSTGRES_USER:-sepscope}:${POSTGRES_PASSWORD:-sepscope}@postgres:5432/${POSTGRES_DB:-sepscope}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sepscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sepscope}
      POSTGRES_DB: ${POSTGRES_DB:-sepscope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Local tools only; not reachable from other machines.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: *database-url
      WORKER_HEALTH_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: *database-url
      API_HOST: 0.0.0.0
      API_PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side requests go straight to the api container.
      API_URL: http://api:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
