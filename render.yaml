# Render Blueprint: the API (web service), the worker (background worker) and a
# managed Postgres database. In Render: New → Blueprint → select this repository.
# Both services migrate the database on start. Deploy the dashboard to Vercel
# (see README → Deployment) and point it at the API's URL.
#
# Plans are starting points; adjust them in the Render dashboard or here.

databases:
  - name: sepscope-db
    plan: basic-256mb
    databaseName: sepscope
    user: sepscope
    # Only the services below need it.
    ipAllowList: []

services:
  - type: web
    name: sepscope-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sepscope-db
          property: connectionString
      # Render routes traffic to the port the service listens on; 10000 is its default.
      - key: API_PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      # Requests arrive through Render's proxy; trust it so rate limits apply per client.
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_TIMEOUT_SECONDS
        value: "25"

  - type: worker
    name: sepscope-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sepscope-db
          property: connectionString
      - key: CHECK_INTERVAL_MINUTES
        value: "15"
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_TIMEOUT_SECONDS
        value: "25"
